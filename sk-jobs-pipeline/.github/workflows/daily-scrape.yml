name: Daily job scrape

on:
  schedule:
    # 5:47 AM Saskatchewan time (11:47 UTC). Saskatchewan has no daylight saving, so this never shifts.
    - cron: "47 11 * * *"
  workflow_dispatch:        # adds a "Run workflow" button for manual runs
    inputs:
      max_jobs:
        description: "Cap postings per source (blank = full crawl)"
        required: false
        default: ""

permissions:
  contents: write           # lets the run commit the updated CSVs back to the repo

concurrency:
  group: daily-scrape       # never run two scrapes at the same time
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          TZ: America/Regina
        run: |
          if [ -n "${{ inputs.max_jobs }}" ]; then
            python sk_jobs_scraper.py --out-dir data --max-jobs "${{ inputs.max_jobs }}"
          else
            python sk_jobs_scraper.py --out-dir data
          fi

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Daily scrape $(TZ=America/Regina date +%F)"
            git push
          fi

      - name: Upload run output (kept 14 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-output-${{ github.run_id }}
          path: data/
          if-no-files-found: ignore
          retention-days: 14

name: Daily job scrape

on:
  schedule:
    # 5:47 AM Saskatchewan time (11:47 UTC). Saskatchewan has no daylight saving, so this never shifts.
    - cron: "47 11 * * *"
  workflow_dispatch:        # adds a "Run workflow" button for manual runs
    inputs:
      max_jobs:
        description: "Cap postings per source (blank = full crawl)"
        required: false
        default: ""

# The project files live in the sk-jobs-pipeline/ folder of this repo.
defaults:
  run:
    working-directory: sk-jobs-pipeline

permissions:
  contents: write           # only used when MongoDB isn't configured (CSV fallback commits data)

concurrency:
  group: daily-scrape       # never run two scrapes at the same time
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}   # Settings -> Secrets and variables -> Actions
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sk-jobs-pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          TZ: America/Regina
        run: |
          if [ -n "${{ inputs.max_jobs }}" ]; then
            python sk_jobs_scraper.py --out-dir data --max-jobs "${{ inputs.max_jobs }}"
          else
            python sk_jobs_scraper.py --out-dir data
          fi

      # With MongoDB configured, the database holds the history, so CSVs are no longer
      # committed (they would bloat the repo); they are still kept as a run artifact below.
      - name: Commit updated data (CSV fallback, only without MongoDB)
        if: env.MONGODB_URI == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Daily scrape $(TZ=America/Regina date +%F)"
            # The repo may have changed while the scrape ran: fold those changes in, then push.
            for attempt in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            exit 1
          fi

      - name: Upload run output (kept 14 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-output-${{ github.run_id }}
          path: sk-jobs-pipeline/data/
          if-no-files-found: ignore
          retention-days: 14
